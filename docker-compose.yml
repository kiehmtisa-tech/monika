# QQ 大肥鱼 - MaiBot + NapCat 部署
# 适配自官方 docker-compose.yml（https://github.com/Mai-with-u/MaiBot）
# 适配点：
#   1. 精简掉 sqlite-web / chat2db（服务器仅 1.6G 内存）
#   2. 所有管理端口绑定 127.0.0.1，仅 SSH 隧道访问
#   3. 增加日志轮转
name: qq-fish

services:
  core:
    container_name: maim-bot-core
    stop_grace_period: 70s
    image: sengokucola/maibot:latest
    environment:
      - TZ=Asia/Shanghai
      - MAIBOT_LEGACY_0X_UPGRADE_CONFIRMED=1
      - MAIBOT_STATISTICS_REPORT_PATH=/MaiMBot/data/maibot_statistics.html
      - HTTP_HOST=0.0.0.0
    ports:
      - "127.0.0.1:18001:8001" # WebUI 仅本机
    volumes:
      - ./docker-config/mmc:/MaiMBot/config
      - ./data/MaiMBot:/MaiMBot/data
      - ./data/MaiMBot-plugin-data:/MaiMBot/data/plugins
      - ./data/MaiMBot/emoji:/data/emoji
      - ./data/MaiMBot/plugins:/MaiMBot/plugins
      - ./data/MaiMBot/logs:/MaiMBot/logs
      - ./depends-data:/MaiMBot/depends-data
      - ./persona:/MaiMBot/persona:ro
    restart: always
    mem_limit: 700m
    memswap_limit: 1200m
    networks:
      - maim_bot
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8001/',timeout=8)"]
      interval: 60s
      timeout: 15s
      retries: 5
      start_period: 120s

  napcat:
    container_name: maim-bot-napcat
    image: mlikiowa/napcat-docker:latest
    environment:
      - NAPCAT_UID=1000
      - NAPCAT_GID=1000
      - TZ=Asia/Shanghai
      - ACCOUNT=${BOT_QQ_ACCOUNT} # 快速登录，避免每次重启都要扫码；值来自 .env
    ports:
      - "127.0.0.1:6099:6099" # NapCat WebUI 仅本机
    volumes:
      - ./docker-config/napcat:/app/napcat/config
      - ./data/qq:/app/.config/QQ
      - ./data/MaiMBot:/MaiMBot/data
    restart: always
    mem_limit: 700m
    memswap_limit: 1200m
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket,sys;s=socket.socket();s.settimeout(3);sys.exit(0 if s.connect_ex(('127.0.0.1',3001))==0 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - maim_bot
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # ---- 预算网关：MaiBot LLM 调用的强制预算闸门（仅 Docker 内网，不发布端口）----
  budget-gateway:
    container_name: qq-fish-budget-gw
    build: ./gateway
    image: qq-fish-budget-gateway:1.0
    environment:
      - TZ=Asia/Shanghai
      - GW_MODEL_CONFIG=/config/model_config.toml
      - GW_SECRETS=/secrets/gateway_secrets.json
      - GW_BUDGET=/budget/budget.json
      - GW_DB=/budget/gateway.db
      - GW_STATUS=/budget/gateway_status.json
      - GW_SETTINGS=/app/settings.json
      - GW_PORT=8009
    volumes:
      - ./docker-config/mmc:/config:ro
      - ./secrets:/secrets:ro
      - ./budget:/budget
    restart: always
    mem_limit: 200m
    memswap_limit: 400m
    networks:
      - maim_bot
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8009/healthz',timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ---- 以下为「满血」可选组件，默认不启动（profile: admin）----
  # 启动：docker compose --profile admin up -d sqlite-web
  # 只在需要查看记忆数据库时临时拉起，用完 docker compose stop sqlite-web 省内存
  sqlite-web:
    profiles: ["admin"]
    image: coleifer/sqlite-web
    container_name: qq-fish-sqlite-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8120:8080" # 仅本机，SSH 隧道访问
    volumes:
      - ./data/MaiMBot:/data/MaiMBot
    environment:
      - SQLITE_DATABASE=MaiMBot/MaiBot.db
    networks:
      - maim_bot
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

networks:
  maim_bot:
    driver: bridge
